<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js?v=20261030145936"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="trio-data.js?v=20261030145936"></script>
  <script src="ocasioes-data.js?v=20261030145936"></script>
</helmet>
<div style="{{ grid }}">
  <sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
    <article style="display:flex;flex-direction:column;background:#F9F8F4;border:1px solid rgba(35,29,26,0.12);min-width:0">
      <a href="{{ c.href }}" style="display:block;position:relative;aspect-ratio:4/3;overflow:hidden;background:#BFB8AF" aria-label="{{ c.ariaConhecer }}">
        <sc-if value="{{ c.hasPhoto }}" hint-placeholder-val="{{ false }}">
          <img src="{{ c.photo }}" alt="{{ c.alt }}" loading="lazy" decoding="async" width="800" height="600" style="width:100%;height:100%;object-fit:cover;display:block">
        </sc-if>
        <sc-if value="{{ c.noPhoto }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Chivo Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#231D1A">Foto provisória</span>
        </sc-if>
        <sc-if value="{{ c.provisional }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;top:12px;left:12px;padding:5px 10px;background:#510303;color:#F9F8F4;font-family:'Chivo Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase">Lançamento</span>
        </sc-if>
      </a>
      <div style="display:flex;flex-direction:column;gap:12px;padding:22px 22px 24px;flex:1">
        <span style="font-family:'Chivo Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#510303">{{ c.bairro }}</span>
        <h3 style="font-family:'Miller Headline','Playfair Display',Georgia,serif;font-weight:400;font-size:26px;line-height:1.1;color:#510303;margin:0">{{ c.name }}</h3>
        <p style="font-family:'General Sans',sans-serif;font-size:13px;font-weight:500;line-height:1.5;color:#231D1A;margin:0">{{ c.meta }}</p>
        <address style="font-family:'General Sans',sans-serif;font-size:13px;line-height:1.5;font-style:normal;color:#231D1A;margin:0">{{ c.endereco }}</address>
        <p style="font-family:'General Sans',sans-serif;font-size:14px;line-height:1.65;color:#231D1A;margin:0;flex:1;text-wrap:pretty">{{ c.text }}</p>
        <sc-if value="{{ c.hasFeats }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <sc-for list="{{ c.feats }}" as="f" hint-placeholder-count="3">
              <span style="font-family:'General Sans',sans-serif;font-size:12px;padding:4px 9px;background:rgba(191,184,175,0.45);color:#231D1A">{{ f }}</span>
            </sc-for>
          </div>
        </sc-if>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
          <a href="{{ c.href }}" style="flex:1 1 140px;text-align:center;font-family:'General Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;padding:13px 12px;border:1px solid #510303;color:#510303;text-decoration:none" style-hover="background:#510303;color:#F9F8F4">Conhecer espaço</a>
          <a href="{{ c.proposta }}" style="flex:1 1 140px;text-align:center;font-family:'General Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;padding:13px 12px;background:#510303;border:1px solid #510303;color:#F9F8F4;text-decoration:none" style-hover="background:#3d0202;color:#F9F8F4">Receber uma proposta</a>
        </div>
      </div>
    </article>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;1400px&quot;},&quot;keys&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ocasiao&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;casamento&quot;,&quot;15anos&quot;,&quot;aniversario&quot;,&quot;barmitzvah&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;social&quot;,&quot;corporativo&quot;],&quot;default&quot;:&quot;social&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;propostaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#contato&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, ready: !!(typeof window !== 'undefined' && window.TRIO && window.TRIO_OCASIOES) };
  componentDidMount() {
    this._r = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._r);
    const chk = () => (window.TRIO && window.TRIO_OCASIOES) ? this.setState({ ready: true }) : (this._p = setTimeout(chk, 60));
    chk();
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); clearTimeout(this._p); }
  renderVals() {
    const { w, ready } = this.state;
    const cols = w < 680 ? 1 : w < 1060 ? 2 : 3;
    const grid = { display: 'grid', gridTemplateColumns: `repeat(${cols}, minmax(0,1fr))`, gap: w < 680 ? '20px' : '24px' };
    if (!ready) return { grid, cards: [] };
    const all = window.TRIO.spaces;
    const keys = (this.props.keys || '').split(',').map(s => s.trim()).filter(Boolean);
    const list = keys.length ? keys.map(k => all.find(s => s.key === k)).filter(Boolean) : all;
    const o = this.props.ocasiao && window.TRIO_OCASIOES[this.props.ocasiao];
    const loc = o && o.blocks.find(b => b.key === 'locais');
    const v = this.props.variant || 'social';
    const cap = s => v === 'corporativo' && s.caps.auditorio ? `${s.area} · auditório para até ${s.caps.auditorio}` + (s.caps.escolar ? ` · escolar ${s.caps.escolar}` : '') : s.caps.coquetel ? `${s.area} · até ${s.caps.coquetel} em coquetel` + (s.caps.jantar ? ` e ${s.caps.jantar} em jantar` : '') : s.caps.ate ? `${s.area} · até ${s.caps.ate} pessoas` : s.area;
    return {
      grid,
      cards: list.map(s => {
        const os = loc && loc.spaces.find(x => x.key === s.key);
        const feats = (os ? os.feats : s.feats).slice(0, this.props.compact ? 3 : 5);
        return {
          name: s.name, bairro: s.bairro, endereco: s.endereco || '', photo: s.photo, hasPhoto: !!s.photo, noPhoto: !s.photo, provisional: !!s.provisional,
          alt: 'Espaço de eventos ' + s.name.replace(' | ', ' ') + ', em ' + s.bairro.split(' · ')[0],
          meta: os ? os.meta : cap(s),
          text: os ? os.paras[0] : (s.paras[0] || s.tagline),
          feats, hasFeats: feats.length > 0,
          href: s.key === 'garden' ? 'trio-garden.dc.html' : ({dezenove:'trio-dezenove',garden:'trio-garden',metropolitan:'trio-metropolitan',one:'trio-one',pergola:'trio-pergola',riverone:'trio-river-one',skylounge:'trio-skylounge',sphall:'trio-sp-hall',trivento:'trio-trivento',auri:'trio-auri'})[s.key] + '.dc.html',
          ariaConhecer: 'Conhecer o ' + s.name.replace(' | ', ' '),
          proposta: this.props.propostaHref || '#contato',
        };
      }),
    };
  }
}
</script>
</body>
</html>
