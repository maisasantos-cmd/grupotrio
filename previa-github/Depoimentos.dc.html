<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js?v=20261117160848"></script>
</head>
<body>
<x-dc>
<section aria-labelledby="dep-h2" style="{{ wrap }}">
  <div style="max-width:1040px;margin:0 auto">
    <div style="text-align:center;margin-bottom:{{ gapTitulo }}">
      <span style="display:block;font-family:'General Sans',sans-serif;font-size:12px;font-weight:500;letter-spacing:4px;text-transform:uppercase;color:#510303;margin-bottom:14px">Depoimentos</span>
      <h2 id="dep-h2" style="font-family:'Miller Headline','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(30px,3.4vw,48px);line-height:1.1;color:#510303;margin:0">{{ title }}</h2>
    </div>
    <div role="group" aria-roledescription="carousel" aria-label="Depoimentos de clientes e parceiros" style="{{ grade }}">
      <button type="button" onClick="{{ prev }}" aria-label="Depoimento anterior" style="width:44px;height:44px;border-radius:50%;border:0;background:rgba(35,29,26,0.8);color:#F9F8F4;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#231D1A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <div aria-live="polite" style="min-width:0">
        <sc-for list="{{ atual }}" as="d" hint-placeholder-count="1">
          <figure role="group" aria-roledescription="slide" aria-label="{{ d.pos }}" style="position:relative;margin:0 auto;max-width:680px;padding-left:{{ recuo }}">
            <span aria-hidden="true" style="position:absolute;left:0;top:-14px;font-family:'Miller Headline','Playfair Display',Georgia,serif;font-size:{{ aspas }};line-height:1;color:#510303;opacity:0.55">“</span>
            <blockquote style="margin:0;font-family:'Miller Headline','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(20px,2.4vw,27px);line-height:1.45;color:#231D1A">{{ d.t }}<span aria-hidden="true" style="display:inline-block;font-size:{{ aspas }};line-height:0;vertical-align:-0.42em;margin-left:6px;color:#510303;opacity:0.55">”</span></blockquote>
            <figcaption style="margin-top:24px;display:flex;flex-direction:column;gap:4px">
              <span style="font-family:'General Sans',sans-serif;font-size:15px;font-weight:500;color:#231D1A">{{ d.n }}</span>
              <span style="font-family:'General Sans',sans-serif;font-size:13px;color:#3d3531">{{ d.e }}</span>
            </figcaption>
            <div style="display:flex;flex-wrap:wrap;align-items:center;column-gap:20px;margin-top:6px">
              <a href="{{ d.href }}" style="display:inline-flex;align-items:center;min-height:44px;font-family:'General Sans',sans-serif;font-size:13px;color:#510303;text-decoration:underline;text-underline-offset:3px" style-hover="color:#231D1A">{{ d.esp }}</a>
              <sc-if value="{{ d.semVideo }}" hint-placeholder-val="{{ true }}">
                <button type="button" onClick="{{ abrir }}" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0;background:none;border:0;cursor:pointer;font-family:'General Sans',sans-serif;font-size:13px;color:#231D1A;text-decoration:underline;text-underline-offset:3px" style-hover="color:#510303"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Assistir ao depoimento</button>
              </sc-if>
            </div>
            <sc-if value="{{ d.comVideo }}" hint-placeholder-val="{{ false }}">
              <div style="position:relative;width:100%;aspect-ratio:16/9;margin-top:12px;background:#231D1A">
                <iframe src="{{ d.embed }}" title="{{ d.aria }}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen="" style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>
              </div>
            </sc-if>
          </figure>
        </sc-for>
      </div>
      <button type="button" onClick="{{ next }}" aria-label="Próximo depoimento" style="width:44px;height:44px;border-radius:50%;border:0;background:#510303;color:#F9F8F4;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#3a0202"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;700px&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Quem já celebrou com a gente&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ocasiao&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;geral&quot;,&quot;casamento&quot;,&quot;15anos&quot;,&quot;aniversario&quot;,&quot;barmitzvah&quot;],&quot;default&quot;:&quot;geral&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const DEPOIMENTOS = [
  { yt: 'R_2VSY8bWkA', t: 'Quando você chega aqui, você se depara com uma vista linda, e é uma visão que você tem durante o dia e durante a noite totalmente diferente uma da outra.', n: 'Roberto e Felipe', e: 'RS Assessoria', esp: 'Trio Pérgola', href: 'trio-pergola.dc.html' },
  { yt: 'aXkx2uwdxsM', t: 'Foi uma experiência incrível participar dessa inauguração e, desde então, eu venho trazendo os meus clientes aqui para conhecerem esse que é um dos espaços mais bonitos de São Paulo.', n: 'Vinícius Favale', e: 'Assessor de casamentos, Múltipla Eventos', esp: 'Trio Pérgola', href: 'trio-pergola.dc.html' },
  { yt: 'l0da_yxzM38', t: 'Eu já realizei muitos casamentos aqui no Trio Pérgola (...). A luz da cidade à noite é realmente maravilhosa. Isso traz imagens impactantes para os clientes.', n: 'Ricardo Hara', e: 'Fotógrafo de casamentos', esp: 'Trio Pérgola', href: 'trio-pergola.dc.html' },
];
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, i: 0, video: false };
  componentDidMount() { this._r = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this._r); }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  ir(i) { const n = DEPOIMENTOS.length; this.setState({ i: (i + n) % n, video: false }); }
  renderVals() {
    const w = this.state.w, mob = w < 700, n = DEPOIMENTOS.length, d = DEPOIMENTOS[this.state.i];
    const origem = typeof location !== 'undefined' && /^https?:/.test(location.origin) ? '&origin=' + encodeURIComponent(location.origin) : '';
    return {
      title: this.props.title || 'Quem já celebrou com a gente',
      atual: [{ ...d, pos: (this.state.i + 1) + ' de ' + n, aria: 'Vídeo do depoimento de ' + d.n, comVideo: this.state.video, semVideo: !this.state.video,
        embed: 'https://www.youtube.com/embed/' + d.yt + '?autoplay=1&rel=0&playsinline=1' + origem }],
      prev: () => this.ir(this.state.i - 1),
      next: () => this.ir(this.state.i + 1),
      abrir: () => this.setState({ video: true }),
      wrap: { background: '#BFB8AF', padding: mob ? '64px 12px' : '96px 48px' },
      grade: { display: 'grid', gridTemplateColumns: '44px minmax(0,1fr) 44px', gap: mob ? '8px' : '32px', alignItems: 'center' },
      gapTitulo: mob ? '40px' : '56px', recuo: mob ? '22px' : '44px', aspas: mob ? '44px' : '72px',
    };
  }
}
</script>
</body>
</html>
